<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevShow - Project Showcase & Feedback Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header / Navbar -->
  <header class="navbar">
    <div class="container navbar-container">
      <h1>DevShow</h1>
      <div id="user-info" class="user-info"></div>
    </div>
  </header>

  <main class="container main-content">
    
    <!-- Hero Section -->
    <section class="hero-section">
      <h2>Share. Discover. Get Feedback.</h2>
      <p>Showcase your projects and get feedback from the community.</p>
    </section>

    <!-- Search and Filter Section -->
    <section class="controls-section">
      <input type="text" id="search-input" class="search-input" placeholder="Search projects by title or description...">
      <div class="filter-buttons" id="filter-buttons">
        <button class="btn filter-btn active" data-tag="All">All</button>
        <button class="btn filter-btn" data-tag="Web">Web</button>
        <button class="btn filter-btn" data-tag="AI">AI</button>
        <button class="btn filter-btn" data-tag="Mobile">Mobile</button>
      </div>
    </section>

    <!-- Projects Feed -->
    <section class="feed-section">
      <div id="project-feed" class="project-grid">
        <!-- Project cards will be injected here by JavaScript -->
      </div>
    </section>

    <!-- Submit Form Section -->
    <section class="submit-section">
      <div class="submit-card">
        <h2>Submit a Project</h2>
        <form id="project-form">
          <div class="form-group">
            <label for="title">Project Title</label>
            <input type="text" id="title" required placeholder="e.g., Personal Portfolio">
          </div>
          
          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" required placeholder="What does this project do?"></textarea>
          </div>

          <div class="form-group">
            <label for="tag">Tag</label>
            <select id="tag" required>
              <option value="Web">Web</option>
              <option value="AI">AI</option>
              <option value="Mobile">Mobile</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="link">Demo or GitHub Link</label>
            <input type="url" id="link" required placeholder="https://github.com/...">
          </div>

          <button type="submit" class="btn submit-btn">Submit Project</button>
        </form>
      </div>
    </section>

  </main>

  <!-- Username Modal (shown on first visit) -->
  <div id="username-modal" class="modal">
    <div class="modal-content">
      <h2>Welcome to DevShow!</h2>
      <p>Please enter a username to continue.</p>
      <input type="text" id="username-input" placeholder="Your username" required>
      <button id="save-username-btn" class="btn primary-btn">Start Exploring</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
